aid: pashouses
name: Pashouses
description: 'Pashouses (PT Pionir Alfa Sejahtera) is an Indonesian proptech company operating an end-to-end
  transactional marketplace for buying and selling ready-to-occupy residential homes across the Greater Jakarta
  (Jabodetabek) region — Jakarta, Tangerang, Tangerang Selatan, Bekasi, Bogor, and Depok. Founded in 2020 by
  Junghans Tasani and Bin Anindita, the platform combines an iBuyer model, brokerage, staging, and renovation
  with mortgage (KPR) origination through partnerships with major Indonesian banks (BCA, Mandiri, BSI, BRI). It
  offers consumer tools including a Smart Agent property assistant, a KPR mortgage calculator, and an
  affordability calculator. QED Investors led a $5M pre-Series B in November 2022 (its first Indonesian /
  Southeast Asian investment). The company exposes a consumer web marketplace only; no public developer, API,
  or documentation surface was found during enrichment.'
